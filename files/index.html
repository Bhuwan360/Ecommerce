<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halide — Film &amp; Darkroom Supply</title>
  <meta name="description" content="A working darkroom's supply catalog: film stock, cameras, chemistry, and paper, chosen by people who still develop by hand." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2316130F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23C8631E' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23C8631E'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to catalog</a>

  <header class="site-header">
    <div class="header-row">
      <a class="wordmark" href="#/" aria-label="Halide home">
        <span class="wordmark-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>
        </span>
        Halide
      </a>

      <nav class="primary-nav" aria-label="Primary">
        <a href="#/catalog/film">Film</a>
        <a href="#/catalog/cameras">Cameras</a>
        <a href="#/catalog/chemistry">Chemistry</a>
        <a href="#/catalog/paper">Paper</a>
        <a href="#/catalog/accessories">Accessories</a>
      </nav>

      <div class="header-actions">
        <button class="search-toggle" id="searchToggle" aria-expanded="false" aria-controls="searchBar" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.6" y2="16.6" stroke="currentColor" stroke-width="2"/></svg>
          <span class="sr-only">Search catalog</span>
        </button>
        <button class="cart-toggle" id="cartToggle" type="button" aria-haspopup="dialog" aria-controls="cartDrawer">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21.5 9H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.4" fill="currentColor"/><circle cx="18" cy="21" r="1.4" fill="currentColor"/></svg>
          Bag
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>

    <div class="search-bar" id="searchBar" hidden>
      <label class="sr-only" for="searchInput">Search film, cameras, chemistry</label>
      <input id="searchInput" type="search" placeholder="Search the catalog — “Tri-X”, “35mm”, “developer” …" autocomplete="off" />
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-row">
      <p class="footer-note">Halide is a demonstration catalog built for a web development capstone. No orders are actually processed.</p>
      <p class="footer-spec">BUILD <span id="buildStamp"></span></p>
    </div>
  </footer>

  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <aside class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Shopping bag" hidden>
    <div class="cart-drawer-head">
      <h2>Your bag</h2>
      <button class="icon-btn" id="cartClose" type="button" aria-label="Close bag">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <div class="cart-drawer-body" id="cartBody"></div>
    <div class="cart-drawer-foot" id="cartFoot"></div>
  </aside>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
